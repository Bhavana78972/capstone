
name: Hello World CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Print build message
        run: echo "Build job completed!"

      

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Print test message
        run: echo "Test job completed!"
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hello World script
        run: bash hello.sh  

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Print deploy message
        run: echo "Deploy job completed!"
